schema_version: 2
commands:
  - strand: forecasting
    frozen_replay_only: true
    changes_model_or_protocol: false
    script_path: "scripts/replay_forecasting.py"
    argv:
      - "python"
      - "scripts/replay_forecasting.py"
      - "--config"
      - "configs/td2_forecast_config.yaml"
      - "--dev-csv"
      - "shared/datasets/daily_demand_development.csv"
      - "--forecast"
      - "artifacts/final_forecast.csv"
      - "--output"
      - "evidence/replay/forecasting/result.json"
    configuration_inputs:
      - "configs/td2_forecast_config.yaml"
    data_inputs:
      - "shared/datasets/daily_demand_development.csv"
      - "artifacts/final_forecast.csv"
    expected_output: "evidence/replay/forecasting/result.json"
  - strand: reinforcement_learning
    frozen_replay_only: true
    changes_model_or_protocol: false
    script_path: "scripts/replay_rl.py"
    argv:
      - "python"
      - "scripts/replay_rl.py"
      - "--config"
      - "configs/td4_rl_config.yaml"
      - "--q-table"
      - "artifacts/q_table.npy"
      - "--output"
      - "evidence/replay/reinforcement_learning/result.json"
    configuration_inputs:
      - "configs/td4_rl_config.yaml"
    data_inputs:
      - "shared/inventory_env.py"
      - "artifacts/q_table.npy"
    expected_output: "evidence/replay/reinforcement_learning/result.json"
